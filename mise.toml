
[settings]
experimental = true
minimum_release_age_excludes = ["android:*"]

[plugins]
"vfox-backend:android" = "https://github.com/mnalmahmud/mise-android"

[tools]
# Pre-commit
pre-commit = "latest"

# Android
java = "21"

# Android SDK
"android:sdk" = "36"
"android:platform-tools" = "latest"
"android:build-tools" = "36.0.0"
"android:cmdline-tools" = "latest"

# Rust / Embassy
rust = "nightly"

[tasks]
# Android
android-build = "cd tricycletops-app && ./gradlew assembleDebug"
android-test = "cd tricycletops-app && ./gradlew test"
android-lint = "cd tricycletops-app && ./gradlew lint"
android-install = "cd tricycletops-app && ./gradlew installDebug"

# Firmware
fw-flash = "cd tricycletops-fw && cargo run"
fw-build = "cd tricycletops-fw && cargo build --target thumbv6m-none-eabi"
fw-check = "cd tricycletops-fw && cargo check --target thumbv6m-none-eabi"
fw-test-host = "cd tricycletops-fw && cargo test --target  host-tuple"

# General
doctor = "java -version && rustc --version && cargo --version && adb version"

schema: spec-driven

operations:
  apply:
    guidance:
      # - "The user explicitly authorizes git commits: Author a conventional commit after completing a task that introduces changes."
      # - Check if the build compiles before committing code changes, and run relevant tests.
      # - If code changes intentionally span multiple tasks to compile, defer committing until the dependent task passes; otherwise, fix failures before proceeding.
      - Keep `README.md` and `GEMINI.md` in sync whenever protocol specifications change.
  archive:
    guidance:
      - Check if the build compiles and relevant tests pass before archiving a change.
      - "The user explicitly authorizes git commits: After archiving, author a conventional commit (docs(openspec): archive <name>) containing a summary of the archive outcome."
      - Ensure `README.md` and `GEMINI.md` reflect any protocol specification changes before archiving.
      - Ensure 'GEMINI.md' is optimized for Gemini clients. Keep content concise.



# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

[package]
name = "tricycletops-fw"
version = "0.1.0"
edition = "2024"

[lib]
name = "tricycletops_fw"
path = "src/lib.rs"

[[bin]]
name = "tricycletops-fw"
path = "src/main.rs"
test = false

[dependencies]
embassy-sync = { version = "0.8.0" }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
static_cell = "2.1.0"
portable-atomic = { version = "1.5.1", features = ["critical-section"] }
critical-section = "1.2"
defmt = "1.1.1"

[target.'cfg(not(all(target_arch = "arm", target_os = "none")))'.dependencies]
embassy-time = { version = "0.5.0", features = ["generic-queue-64"] }

[target.'cfg(not(all(target_arch = "arm", target_os = "none")))'.dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-rp = { version = "0.10.0", features = [
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
    "defmt",
]}
embassy-time = { version = "0.5.0", features = [
    "defmt-timestamp-uptime",
    "defmt",
] }
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs", "bluetooth"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
trouble-host = { version = "0.7.0", features = ["defmt", "gatt", "derive"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
embassy-usb = { version = "0.6.0", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[build-dependencies]
reqwest = { version = "0.13.4", features = ["blocking"]}

[patch.crates-io]
cyw43 = { version = "0.7.0", git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de"}
cyw43-pio = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de"}
embassy-rp = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de"}
embassy-sync = { version = "0.8.0", git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de"}
embassy-executor = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de"}
embassy-time = { version = "0.5.1", git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de"}
embassy-usb = { version = "0.6.0", git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de"}
